version: '3'

includes:
  common: ../Taskfile.yaml

tasks:
  build:
    summary: Builds the application for Linux
    deps:
      - task: common:generate:icons
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          PRODUCTION: '{{.PRODUCTION | default "false"}}'
    cmds:
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}"
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -X main.Commit={{.GIT_COMMIT_HASH}} -X main.Version={{.KANMAIL_APP_VERSION}}"{{else}}-buildvcs=false -gcflags=all="-l" -ldflags="-X main.Commit={{.GIT_COMMIT_HASH}} -X main.Version={{.KANMAIL_APP_VERSION}}"{{end}}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  package:
    summary: Packages a production build of the application for Linux
    deps:
      - task: build
        vars:
          PRODUCTION: '{{.PRODUCTION | default "true"}}'
    cmds:
      - task: create:appimage

  create:appimage:
    summary: Creates an AppImage
    deps:
      - task: generate:dotdesktop
      - task: generate:appdir
      - task: build
        vars:
          PRODUCTION: '{{.PRODUCTION | default "true"}}'
    cmds:
      - |
        # Extend path so we can use linuxdeploy-plugin-gtk.sh
        export PATH=$PATH:{{.ROOT_DIR}}/build/linux
        linuxdeploy --appimage-extract-and-run -e bin/{{.APP_NAME}} --plugin gtk --output appimage --appdir {{.ROOT_DIR}}/build/appdir --desktop-file {{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop --icon-file build/appicon.png

  generate:appdir:
    summary: Generates the initial AppDir for linuxdeploy
    cmds:
      - mkdir -p {{.ROOT_DIR}}/build/appdir
      - |
        cd {{.ROOT_DIR}}/build/appdir
        find /usr/lib* -name WebKitNetworkProcess -print -exec mkdir -p $(dirname '{}') \; -exec cp --parents '{}' "." \;
        find /usr/lib* -name WebKitWebProcess -print -exec mkdir -p $(dirname '{}') \; -exec cp --parents '{}' "." \;
        find /usr/lib* -name libwebkit2gtkinjectedbundle.so -print -exec mkdir -p $(dirname '{}') \; -exec cp --parents '{}' "." \;
        ln -s usr/lib lib

  generate:dotdesktop:
    summary: Generates a `.desktop` file
    cmds:
      - wails3 generate .desktop -name "{{.APP_NAME}}" -exec "{{.APP_NAME}}" -icon "{{.ICON}}" -outputfile {{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop
    vars:
      ICON: 'appicon'

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
