version: '3'

includes:
  common: ../Taskfile.yaml

tasks:
  generate:syso:
    summary: Generates Windows `.syso` file
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  build:
    summary: Builds the application for Windows
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          PRODUCTION: '{{.PRODUCTION}}'
      - task: common:generate:icons
    cmds:
      - task: generate:syso
      - go build {{.BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}.exe
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui -X main.Commit={{.GIT_COMMIT_HASH}} -X main.Version={{.KANMAIL_APP_VERSION}}"{{else}}-buildvcs=false -gcflags=all="-l" -ldflags="-X main.Commit={{.GIT_COMMIT_HASH}} -X main.Version={{.KANMAIL_APP_VERSION}}"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  package:
    summary: Packages a production build of the application into a `.exe` bundle
    cmds:
      - task: create:nsis:installer

  create:nsis:installer:
    summary: Builds the application and creates an NSIS installer
    deps:
      - task: build
        vars:
          PRODUCTION: '{{.PRODUCTION | default "true"}}'
    cmds:
      - task: create:nsis:installer:prebuilt

  create:nsis:installer:prebuilt:
    summary: Creates an NSIS installer from the existing exe without rebuilding it, so a signed exe stays signed
    dir: build/windows/nsis
    cmds:
      # Create the Microsoft WebView2 bootstrapper if it doesn't exist
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/nsis"
      - sed -e s/KANMAIL_APP_VERSION/{{.KANMAIL_APP_VERSION}}/ -e s/KANMAIL_NSIS_VERSION/{{.NSIS_VERSION}}/ project.nsi.tpl > project.nsi
      - makensis -DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe" project.nsi
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      ARG_FLAG: '{{if eq .ARCH "amd64"}}AMD64{{else}}ARM64{{end}}'
      KANMAIL_APP_VERSION: '{{.KANMAIL_APP_VERSION | default 0}}'
      # NSIS needs X.X.X.X with 16-bit parts: 2.YYMMDDHHMMSS becomes 2.YYMM.DDHH.MMSS, anything else 0.0.0.0
      NSIS_VERSION:
        sh: echo "{{.KANMAIL_APP_VERSION}}" | sed -nE 's/^([0-9]+)\.([0-9]{4})([0-9]{4})([0-9]{4})$/\1.\2.\3.\4/p' | grep . || echo 0.0.0.0

  run:
    cmds:
      - '{{.BIN_DIR}}\\{{.APP_NAME}}.exe'
