name: Kanmail v2 CI

on:
  push:
    tags: 2.*
  workflow_dispatch:

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go mod tidy
      - run: go test -v ./internal/...

  build-linux-windows-amd64:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    needs:
      - test
    env:
      PRODUCTION: "true"
      KANMAIL_APP_VERSION: ${{ github.ref_name }}
    steps:
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev mingw-w64 nsis
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go install -v github.com/wailsapp/wails/v3/cmd/wails3@latest
      - name: Write secrets_production.go
        run: echo ${{ secrets.GO_SECRETS_PRODUCTION_BASE64 }} | base64 --decode > internal/constants/secrets_production.go
      # Linux
      - name: Build linux/amd64
        run: wails3 task linux:build
      - name: Build AppImage
        run: wails3 task linux:create:appimage
      - uses: actions/upload-artifact@v4
        with:
          name: Kanmail-amd64.AppImage
          path: bin/kanmail-x86_64.AppImage
          if-no-files-found: error
          retention-days: 1
      # Windows
      - name: Build windows/amd64
        run: wails3 task windows:build
        env:
          CC: x86_64-w64-mingw32-gcc
      - name: Build windows installer
        run: wails3 task windows:create:nsis:installer
        env:
          CC: x86_64-w64-mingw32-gcc
      - uses: actions/upload-artifact@v4
        with:
          name: Kanmail-amd64.exe
          path: bin/Kanmail.exe
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: Kanmail-installer-amd64.exe
          path: bin/Kanmail-amd64-installer.exe
          if-no-files-found: error
          retention-days: 1

  build-linux-arm:
    runs-on: blacksmith-4vcpu-ubuntu-2204-arm
    needs:
      - test
    env:
      PRODUCTION: "true"
      KANMAIL_APP_VERSION: ${{ github.ref_name }}
    steps:
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go install -v github.com/wailsapp/wails/v3/cmd/wails3@latest
      - name: Write secrets_production.go
        run: echo ${{ secrets.GO_SECRETS_PRODUCTION_BASE64 }} | base64 --decode > internal/constants/secrets_production.go
      - name: Build linux/amd64
        run: wails3 task linux:build
      - name: Build AppImage
        run: wails3 task linux:create:appimage
      - run: find bin/
      - uses: actions/upload-artifact@v4
        with:
          name: Kanmail-arm64.AppImage
          path: bin/kanmail-aarch64.AppImage
          if-no-files-found: error
          retention-days: 1

  build-macos:
    runs-on: macos-13
    needs:
      - test
    env:
      PRODUCTION: "true"
      KANMAIL_APP_VERSION: ${{ github.ref_name }}
    steps:
      - name: macOS/Import Apple Developer Certificate
        run: |
          echo ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }} | base64 --decode > signing-certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import signing-certificate.p12 -k build.keychain -P "" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go install -v github.com/wailsapp/wails/v3/cmd/wails3@latest
      - name: Write secrets_production.go
        run: echo ${{ secrets.GO_SECRETS_PRODUCTION_BASE64 }} | base64 --decode > internal/constants/secrets_production.go
      - name: Build darwin/universal
        run: |
          echo ${{ secrets.MACOS_NOTARIZATION_KEY_BASE64 }} | base64 --decode > $MACOS_NOTARIZATION_KEY_PATH
          wails3 task package
        env:
          MACOS_SIGNING_KEY_ID: ${{ secrets.MACOS_SIGNING_KEY_ID }}
          MACOS_NOTARIZATION_KEY_PATH: notarization-certificate.p12
          MACOS_NOTARIZATION_KEY_ID: ${{ secrets.MACOS_NOTARIZATION_KEY_ID }}
          MACOS_NOTARIZATION_ISSUER: ${{ secrets.MACOS_NOTARIZATION_ISSUER }}
      - run: |
          ditto -c -k --keepParent bin/Kanmail.app bin/Kanmail.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Kanmail-macos.app
          path: bin/Kanmail.app.zip
          if-no-files-found: error
          retention-days: 1

  upload-artifacts:
    if: ${{ always() }}
    needs:
      - build-linux-windows-amd64
      - build-linux-arm
      - build-macos
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v5
      with:
        path: artifacts
        merge-multiple: true
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_KEY_SECRET }}
        aws-region: eu-central-1
    - name: Upload artifacts to S3
      run: |
        aws s3 sync ./artifacts/ s3://builds.kanmail.io/${{ github.ref_name }}/
