version: '3'

includes:
  common: ./build/Taskfile.yaml
  windows: ./build/windows/Taskfile.yaml
  darwin: ./build/darwin/Taskfile.yaml
  linux: ./build/linux/Taskfile.yaml

vars:
  APP_NAME: "Kanmail"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yaml -port {{.VITE_PORT}}

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Builds and runs a development server
    cmds:
      - task: common:run:server

  run:server:e2e:
    summary: Runs a headless dev server with fake data, for e2e testing (localhost:8080)
    deps:
      - task: common:build:server
        vars:
          PRODUCTION: "false"
    cmds:
      - '"./{{.BIN_DIR}}/{{.APP_NAME}}-server{{exeExt}}"'
    env:
      KANMAIL_PROFILE: e2e
      KANMAIL_DEBUG_CACHES_DISABLE: 1
      KANMAIL_DEBUG_FAKE_IMAP: '{{.FAKE_DATA | default "on"}}'
      KANMAIL_DEBUG_FAKE_KEYRING: 1
      KANMAIL_DEBUG_FAKE_LICENSED: 1
