# Kanmail IMAP test server: Dovecot 2.3, Maildir++ without the NAMESPACE capability
!include common.conf.inc

mail_location = maildir:~/Maildir

# Dovecot 2.3.21's advertised capabilities minus NAMESPACE (the command itself
# still works, a client that checks capabilities first has to learn the
# delimiter from LIST instead)
imap_capability = IMAP4rev1 SASL-IR LOGIN-REFERRALS ID ENABLE IDLE SORT SORT=DISPLAY THREAD=REFERENCES THREAD=REFS THREAD=ORDEREDSUBJECT MULTIAPPEND URL-PARTIAL CATENATE UNSELECT CHILDREN UIDPLUS LIST-EXTENDED I18NLEVEL=1 CONDSTORE QRESYNC ESEARCH ESORT SEARCHRES WITHIN CONTEXT=SEARCH LIST-STATUS BINARY MOVE SNIPPET=FUZZY PREVIEW=FUZZY PREVIEW STATUS=SIZE SAVEDATE LITERAL+ NOTIFY SPECIAL-USE

namespace inbox {
  inbox = yes
  separator = .
  prefix =
  !include mailboxes.conf.inc
}
