# Kanmail IMAP test server: Dovecot 2.3, Maildir++ with an "INBOX." personal prefix
!include common.conf.inc

mail_location = maildir:~/Maildir

namespace inbox {
  inbox = yes
  separator = .
  prefix = INBOX.
  !include mailboxes.conf.inc
}

# A public namespace outside the personal prefix - the shape a shared mailbox
# takes when personal folders live under "INBOX." (Courier's "#shared.", Cyrus's
# legacy "user."): no walk of the personal namespace ever reaches it
namespace public {
  type = public
  separator = .
  prefix = shared.
  location = maildir:/srv/mail/public:INDEX=~/Maildir/public:CONTROL=~/Maildir/public
  list = yes
  subscriptions = no
}
