# Kanmail IMAP test server: Cyrus master configuration shared by both imapd.conf
# variants. Only IMAP is served; idled makes IDLE notifications immediate.
START {
    recover     cmd="ctl_cyrusdb -r"
}

SERVICES {
    imap        cmd="imapd" listen="143" prefork=2 maxchild=200
    imaps       cmd="imapd -s" listen="993" prefork=2 maxchild=200
}

DAEMON {
    idled       cmd="idled"
}

EVENTS {
    checkpoint  cmd="ctl_cyrusdb -c" period=30
}
