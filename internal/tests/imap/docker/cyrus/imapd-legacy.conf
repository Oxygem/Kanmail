# Kanmail IMAP test server: Cyrus IMAP 3.6 with the pre-3.0 namespace, personal
# folders under "INBOX." with the "." delimiter ("user." for other users, ""
# for shared)
configdirectory: /var/lib/cyrus
partition-default: /var/spool/cyrus/mail
admins: cyrus
servername: localhost

altnamespace: 0
unixhierarchysep: 0
virtdomains: off
delete_mode: immediate
expunge_mode: immediate

# Users get their INBOX and special folders on first login
autocreate_quota: 0
autocreate_inbox_folders: Sent | Drafts | Trash | Junk
autocreate_subscribe_folders: Sent | Drafts | Trash | Junk
xlist-sent: Sent
xlist-drafts: Drafts
xlist-trash: Trash
xlist-junk: Junk

# Passwords from /etc/sasldb2, cleartext mechanisms only once TLS is up
sasl_pwcheck_method: auxprop
sasl_auxprop_plugin: sasldb
sasl_mech_list: PLAIN LOGIN
allowplaintext: 0

tls_server_cert: /certs/cert.pem
tls_server_key: /certs/key.pem
